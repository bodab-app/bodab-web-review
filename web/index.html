<!doctype html>
<html lang="ko">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17483a">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data:; worker-src 'self' blob:; form-action 'none'; object-src 'none'; base-uri 'self'">
  <link rel="icon" href="favicon.png">
  <title>보답</title>
  <style>
    html, body { margin: 0; background: #f8f6f0; }
    #loading { min-height: 100vh; display: grid; place-content: center; gap: .8rem;
      text-align: center; font-family: system-ui, sans-serif; color: #285d4b; }
    #loading strong { font-size: 2rem; }
    #loading-actions { max-width: 25rem; padding: 0 1.5rem; line-height: 1.5; }
    #loading-actions button { box-sizing: border-box; font: inherit;
      display: block; width: 100%; padding: .75rem 1rem; margin: .65rem auto;
      border-radius: .8rem; border: 1px solid #285d4b; cursor: pointer; }
    #loading-actions button { background: #285d4b; color: white; }
  </style>
</head>
<body>
  <div id="loading">
    <strong>보답</strong><span id="loading-status" role="status">오늘 홈을 여는 중이에요…</span>
    <div id="loading-actions" hidden>
      <button type="button" id="loading-retry">이 주소 다시 불러오기</button>
    </div>
    <noscript>보답을 열려면 브라우저에서 JavaScript를 허용해 주세요.</noscript>
  </div>
  <script src="review_ready.js"></script>
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
